<body>
    <div id="root"></div>

    <!-- 游戏组件 - 在 React 加载前定义 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>

// 历史游戏组件 - 使用 React
const { useState, useEffect } = React;

// 游戏主菜单
const GamesView = ({ go, addPoints }) => {
    const [currentGame, setCurrentGame] = useState(null);

    const games = [
        { id: 'timeline', icon: '⏳', title: '时光排序', desc: '历史事件按时间排序', color: '#C79A4B' },
        { id: 'silkroad', icon: '🐫', title: '丝路寻宝', desc: '重走丝绸之路', color: '#84A59D' },
        { id: 'relic', icon: '🏺', title: '文物修复', desc: '修复国宝级文物', color: '#B23A2E' },
        { id: 'masters', icon: '📜', title: '思想擂台', desc: '百家争鸣大辩论', color: '#5E7D6B' },
        { id: 'voyage', icon: '⛵', title: '郑和航海', desc: '下西洋决策挑战', color: '#4A6FA5' },
    ];

    if (currentGame === 'timeline') return <TimelineGame onBack={() => setCurrentGame(null)} addPoints={addPoints} />;
    if (currentGame === 'silkroad') return <SilkRoadGame onBack={() => setCurrentGame(null)} addPoints={addPoints} />;
    if (currentGame === 'relic') return <RelicGame onBack={() => setCurrentGame(null)} addPoints={addPoints} />;
    if (currentGame === 'masters') return <MastersGame onBack={() => setCurrentGame(null)} addPoints={addPoints} />;
    if (currentGame === 'voyage') return <VoyageGame onBack={() => setCurrentGame(null)} addPoints={addPoints} />;

    return (
        <div className="rise-in">
            <button onClick={() => go('home')} className="mb-4 text-sm font-bold text-muted-foreground hover:text-foreground">
                ← 返回首页
            </button>
            <header className="mb-6 text-center">
                <h2 className="font-display text-3xl font-black">🎮 历史游戏乐园</h2>
                <p className="mt-1 text-sm text-muted-foreground">边玩边学，考点全掌握！</p>
            </header>
            <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                {games.map((g, i) => (
                    <button
                        key={g.id}
                        onClick={() => setCurrentGame(g.id)}
                        className="rise-in paper-card ink-edge group rounded-2xl p-6 text-left transition-transform hover:scale-105"
                        style={{ animationDelay: `${i * 0.1}s` }}
                    >
                        <div className="flex h-14 w-14 items-center justify-center rounded-xl text-3xl" style={{ backgroundColor: g.color + '20' }}>
                            {g.icon}
                        </div>
                        <h3 className="mt-4 font-display text-xl font-bold">{g.title}</h3>
                        <p className="mt-1 text-sm text-muted-foreground">{g.desc}</p>
                        <div className="mt-3 text-xs font-bold" style={{ color: g.color }}>开始挑战 →</div>
                    </button>
                ))}
            </div>
        </div>
    );
};

// 游戏1: 时光排序
const TimelineGame = ({ onBack, addPoints }) => {
    const allEvents = [
        { id: 1, name: '元谋人出现', year: '约170万年前', order: 1 },
        { id: 2, name: '北京人使用天然火', year: '约70-20万年前', order: 2 },
        { id: 3, name: '河姆渡人种植水稻', year: '约7000年前', order: 3 },
        { id: 4, name: '夏朝建立', year: '约公元前2070年', order: 4 },
        { id: 5, name: '商汤灭夏', year: '约公元前1600年', order: 5 },
        { id: 6, name: '武王伐纣', year: '公元前1046年', order: 6 },
        { id: 7, name: '春秋时期开始', year: '公元前770年', order: 7 },
        { id: 8, name: '孔子创立儒家', year: '公元前551年', order: 8 },
        { id: 9, name: '商鞅变法', year: '公元前356年', order: 9 },
        { id: 10, name: '秦统一六国', year: '公元前221年', order: 10 },
        { id: 11, name: '西汉建立', year: '公元前202年', order: 11 },
        { id: 12, name: '张骞出使西域', year: '公元前138年', order: 12 },
        { id: 13, name: '赤壁之战', year: '208年', order: 13 },
        { id: 14, name: '隋朝建立', year: '581年', order: 14 },
        { id: 15, name: '唐朝建立', year: '618年', order: 15 },
        { id: 16, name: '北宋建立', year: '960年', order: 16 },
        { id: 17, name: '元朝建立', year: '1271年', order: 17 },
        { id: 18, name: '明朝建立', year: '1368年', order: 18 },
        { id: 19, name: '郑和下西洋', year: '1405-1433年', order: 19 },
        { id: 20, name: '清朝建立', year: '1636年', order: 20 },
    ];

    const [level, setLevel] = useState(1);
    const [events, setEvents] = useState([]);
    const [selected, setSelected] = useState([]);
    const [score, setScore] = useState(0);
    const [showResult, setShowResult] = useState(false);
    const [feedback, setFeedback] = useState('');

    useEffect(() => { startLevel(); }, [level]);

    const startLevel = () => {
        const count = Math.min(4 + level, 8);
        const shuffled = [...allEvents].sort(() => Math.random() - 0.5).slice(0, count);
        setEvents(shuffled);
        setSelected([]);
        setShowResult(false);
        setFeedback('');
    };

    const handleSelect = (event) => {
        if (showResult) return;
        if (selected.find(s => s.id === event.id)) {
            setSelected(selected.filter(s => s.id !== event.id));
        } else {
            setSelected([...selected, event]);
        }
    };

    const checkAnswer = () => {
        if (selected.length !== events.length) {
            setFeedback('请先把所有事件都点一遍！');
            return;
        }
        const isCorrect = selected.every((e, i) => i === 0 || e.order > selected[i-1].order);
        setShowResult(true);
        if (isCorrect) {
            const points = level * 10;
            setScore(s => s + points);
            addPoints(points);
            setFeedback(`🎉 太棒了！完全正确！+${points}分`);
        } else {
            let wrongAt = -1;
            for (let i = 1; i < selected.length; i++) {
                if (selected[i].order < selected[i-1].order) { wrongAt = i; break; }
            }
            setFeedback(`❌ 第${wrongAt + 1}个位置有误，再想想~`);
        }
    };

    return (
        <div className="rise-in">
            <button onClick={onBack} className="mb-4 text-sm font-bold text-muted-foreground hover:text-foreground">← 返回游戏列表</button>

                        <span className="rounded-full bg-primary/10 px-3 py-1 text-sm font-bold text-primary">⭐ {score}分</span>
                    </div>
                </div>
                <p className="text-sm text-muted-foreground mb-4">点击历史事件，按时间先后顺序排列</p>
                {showResult ? (
                    <div className="text-center py-8">
                        <div className="text-5xl mb-4">{feedback.includes('🎉') ? '🎉' : '💪'}</div>
                        <p className="text-lg font-bold mb-4">{feedback}</p>
                        {feedback.includes('🎉') ? (
                            <button onClick={() => setLevel(l => l + 1)} className="px-8 py-3 rounded-xl font-bold bg-primary text-primary-foreground">下一关 →</button>
                        ) : (
                            <div className="space-y-3">
                                <div className="bg-muted rounded-xl p-4 text-left">
                                    <p className="font-bold mb-2">正确顺序：</p>
                                    {[...events].sort((a, b) => a.order - b.order).map((e, i) => (
                                        <div key={e.id} className="text-sm py-1">{i + 1}. {e.name} <span className="text-muted-foreground">({e.year})</span></div>
                                    ))}
                                </div>
                                <button onClick={startLevel} className="px-8 py-3 rounded-xl font-bold bg-primary text-primary-foreground">再试一次</button>
                            </div>
                        )}
                    </div>
                ) : (
                    <>
                        <div className="grid gap-2 md:grid-cols-2 mb-4">
                            {events.map((e) => (
                                <button key={e.id} onClick={() => handleSelect(e)} className={`p-3 rounded-xl text-left transition-all ${selected.find(s => s.id === e.id) ? 'bg-primary text-primary-foreground shadow-lg' : 'bg-muted hover:bg-muted/80'}`}>
                                    <div className="font-bold">{e.name}</div>
                                    <div className={`text-xs ${selected.find(s => s.id === e.id) ? 'opacity-80' : 'text-muted-foreground'}`}>
                                        {selected.findIndex(s => s.id === e.id) >= 0 ? `第${selected.findIndex(s => s.id === e.id) + 1}个` : e.year}
                                    </div>
                                </button>
                            ))}
                        </div>
                        <div className="flex flex-wrap gap-2 min-h-[60px] p-3 bg-background/50 rounded-xl border-2 border-dashed border-border mb-4">
                            {selected.map((e, i) => (
                                <div key={e.id} className="bg-primary text-primary-foreground px-3 py-2 rounded-lg text-sm font-bold">{i + 1}. {e.name}</div>
                            ))}
                            {selected.length === 0 && <span className="text-muted-foreground text-sm self-center">👆 点击上方事件排序</span>}
                        </div>
                        <div className="flex gap-3">
                            <button onClick={checkAnswer} disabled={selected.length !== events.length} className="flex-1 py-3 rounded-xl font-bold bg-primary text-primary-foreground disabled:opacity-50">确认排序</button>
                            <button onClick={startLevel} className="px-6 py-3 rounded-xl font-bold bg-muted hover:bg-muted/80">重新洗牌</button>
                        </div>
                    </>
                )}
            </div>
        </div>
    );
};

const SilkRoadGame = ({ onBack, addPoints }) => {
    const [current, setCurrent] = useState(0);
    const [score, setScore] = useState(0);
    const [visited, setVisited] = useState([0]);

    const nodes = [
        { id: 0, name: '长安', desc: '丝绸之路起点' },
        { id: 1, name: '河西走廊', desc: '通往西域的咽喉', quiz: { q: '河西走廊位于哪条河以西？', options: ['黄河', '长江', '淮河'], answer: 0 } },
        { id: 2, name: '西域', desc: '今新疆及中亚', quiz: { q: '公元前60年西汉设立了什么机构？', options: ['西域都护', '安西都护府', '伊犁将军'], answer: 0 } },
        { id: 3, name: '中亚', desc: '丝绸之路中段', quiz: { q: '从西域传入中原的是？', options: ['葡萄', '丝绸', '瓷器'], answer: 0 } },
        { id: 4, name: '欧洲', desc: '丝绸之路终点', quiz: { q: '汉朝称古罗马为什么？', options: ['大秦', '大食', '安息'], answer: 0 } },
    ];

    const [showQuiz, setShowQuiz] = useState(false);
    const [quizResult, setQuizResult] = useState(null);

    const handleNodeClick = (idx) => {
        if (idx === current + 1) {
            if (nodes[idx].quiz) {
                setShowQuiz(true);
                setQuizResult(null);
            } else {
                moveToNode(idx);
            }
        }
    };

    const moveToNode = (idx) => {
        setCurrent(idx);
        setVisited([...visited, idx]);
        if (idx === nodes.length - 1) {
            const bonus = 20;
            setScore(s => s + bonus);
            addPoints(bonus);
        }
    };

    const answerQuiz = (answerIdx) => {
        const quiz = nodes[current + 1].quiz;
        if (answerIdx === quiz.answer) {
            const points = 10;
            setScore(s => s + points);
            addPoints(points);
            setQuizResult({ correct: true });
            setTimeout(() => {
                setShowQuiz(false);
                moveToNode(current + 1);
            }, 1000);
        } else {
            setQuizResult({ correct: false });
        }
    };

    return (
        <div className="rise-in">
            <button onClick={onBack} className="mb-4 text-sm font-bold text-muted-foreground hover:text-foreground">← 返回游戏列表</button>
            <div className="paper-card ink-edge rounded-2xl p-6">
                <div className="flex items-center justify-between mb-4">
                    <h3 className="font-display text-2xl font-black">🐫 丝路寻宝图</h3>
                    <span className="rounded-full bg-primary/10 px-3 py-1 text-sm font-bold text-primary">⭐ {score}分</span>
                </div>
                <div className="flex justify-between items-center mb-6">
                    {nodes.map((n, i) => (
                        <button key={n.id} onClick={() => handleNodeClick(i)} className={`w-12 h-12 rounded-full flex items-center justify-center font-bold transition-all ${i === current ? 'bg-red-600 text-white scale-125' : visited.includes(i) ? 'bg-green-600 text-white' : i === current + 1 ? 'bg-amber-500 text-white animate-pulse' : 'bg-muted text-muted-foreground'}`}>
                            {visited.includes(i) ? '✓' : i + 1}
                        </button>
                    ))}
                </div>
                <div className="bg-amber-50 rounded-xl p-4 mb-4">
                    📍 当前位置: <strong>{nodes[current].name}</strong> - {nodes[current].desc}
                </div>
                {showQuiz && nodes[current + 1]?.quiz && (
                    <div className="bg-white rounded-xl p-4 border-2 border-amber-200">
                        <h4 className="font-bold mb-3">📋 {nodes[current + 1].name} - 过关问答</h4>
                        <p className="mb-3">{nodes[current + 1].quiz.q}</p>
                        <div className="space-y-2">
                            {nodes[current + 1].quiz.options.map((opt, i) => (
                                <button key={i} onClick={() => answerQuiz(i)} disabled={quizResult !== null} className={`w-full p-3 rounded-xl text-left ${quizResult !== null ? (i === nodes[current + 1].quiz.answer ? 'bg-green-100 border-2 border-green-500' : 'bg-muted') : 'bg-muted hover:bg-muted/80'}`}>
                                    {opt}
                                </button>
                            ))}
                        </div>
                        {quizResult && (
                            <div className={`mt-4 p-3 rounded-xl ${quizResult.correct ? 'bg-green-50 text-green-800' : 'bg-red-50 text-red-800'}`}>
                                {quizResult.correct ? '🎉 回答正确！+10分' : '❌ 回答错误'}
                            </div>
                        )}
                    </div>
                )}
                {current === nodes.length - 1 && (
                    <div className="text-center py-6 bg-gradient-to-r from-amber-50 to-orange-50 rounded-xl">
                        <div className="text-5xl mb-3">🏆</div>
                        <h4 className="font-bold text-xl mb-2">恭喜完成丝绸之路！</h4>
                        <div className="text-2xl font-bold text-primary">最终得分：{score}</div>
                    </div>
                )}
            </div>
        </div>
    );
};

                        <p className="text-sm text-muted-foreground mb-3">{scenario.options[selected]?.feedback}</p>
                        <button onClick={next} className="px-6 py-2 rounded-lg font-bold bg-primary text-primary-foreground">
                            {current + 1 >= scenarios.length ? '完成航海 →' : '继续航行 →'}
                        </button>
                    </div>
                )}
            </div>
        </div>
    );
};

2",no:2,title:"原始农业与史前社会",art:"🌾",mapId:"shiqian",points:[{label:"原始农业兴起",text:"距今1万年左右，我国出现最早的人工栽培农作物。长江中下游先民栽培稻，北方先民栽培粟和黍——稻、粟、黍的人工栽培是我们的祖先为人类文明作出的重要贡献。"},{label:"河姆渡人",text:"浙江余姚，距今约7000年，长江流域：干栏式建筑、木结构水井、种植水稻、农业工具以骨耜最为典型、制作黑陶。"},{label:"半坡人",text:"陕西西安半坡村，距今约6000年，黄河流域：半地穴式圆形房屋、种植粟、使用磨制石器（新石器时代）、制作彩陶（人面鱼纹彩陶盆）、会纺织制衣。"},{label:"大汶口文化",text:"距今约6300—4500年，制陶技术发展（黑陶、白陶），墓葬随葬品差别悬殊，说明出现了贫富分化。"},{label:"意义",text:"原始农业为古代文明社会的形成奠定了重要物质基础。"}],traps:["河姆渡=长江流域=水稻+干栏式；半坡=黄河流域=粟+半地穴式。南北对应最容易考反。","磨制石器=新石器时代，打制石器=旧石器时代，按时代记，别按人名记。"],examTip:'高频考法：给出房屋样式或陶器图片判断文化类型；"南稻北粟"格局几乎年年涉及。',quiz:[{q:"下列原始居民中，种植水稻、住干栏式房屋的是（ ）",options:["半坡人","河姆渡人","北京人","山顶洞人"],answer:1,explain:"河姆渡人生活在长江流域，种水稻、住干栏式房屋；半坡人种粟、住半地穴式房屋。"},{q:"半坡人使用的石器属于（ ）",options:["打制石器，旧石器时代","磨制石器，新石器时代","青铜器","铁器"],answer:1,explain:"半坡人普遍使用磨制石器，处于新石器时代。"}]},{id:"a3",no:3,title:"中华文明的起源与形成",art:"🐉",points:[{label:"早期城市与国家",text:"距今5300—4300年的良渚古城（浙江余杭）有宫殿区、内外城和大型水利系统，出土玉琮、玉璧，说明长江下游地区已经出现早期国家；陶寺古城（山西襄汾）表明黄河中游出现早期国家。"},{label:"炎黄联盟",text:'阪泉之战黄帝打败炎帝，结成联盟；涿鹿之战炎黄打败蚩尤。炎帝、黄帝被尊崇为中华民族的人文初祖，海内外华人自称"炎黄子孙"。'},{label:"尧舜禹",text:"尧、舜、禹依次通过禅让制成为部落联盟首领；大禹治水采用疏导的方法，三过家门而不入。"},{label:"文明特征",text:"中华文明的起源具有多元一体的特征。"}],traps:['"人文初祖"是炎帝和黄帝两个人，不是只有黄帝。',"禅让制选贤与能，世袭制从启开始——这是第4课的分界线。"],examTip:'良渚古城申遗成功是近年热点，常考"早期国家出现的标志"（私有制、阶级、城市的产生）。',quiz:[{q:'被尊崇为中华民族"人文初祖"的是（ ）',options:["尧和舜","炎帝和黄帝","大禹和启","伏羲和女娲"],answer:1,explain:"炎帝和黄帝部落联盟在涿鹿之战打败蚩尤，二人被尊为中华民族的人文初祖。"},{q:"良渚古城遗址的发现，说明距今约5000年（ ）",options:["中国进入青铜时代","长江下游地区已出现早期国家","统一多民族国家建立","铁器牛耕得到推广"],answer:1,explain:"良渚古城有宫殿、城墙、水利系统和象征身份的玉器，说明阶级分化明显，长江下游已出现早期国家。"}]}]},{id:"a-u2",title:"第二单元 夏商周时期",theme:"奴隶制王朝的更替和向封建社会的过渡",color:"green",lessons:[{id:"a4",no:4,title:"夏商西周王朝的更替",art:"👑",mapId:"chunqiu",points:[{label:"夏朝建立",text:'约公元前2070年，禹建立夏王朝——我国历史上第一个王朝。禹死后，启继承父位，世袭制代替了禅让制，"公天下"变成"家天下"。'},{label:"商朝",text:"约公元前1600年，汤灭夏建立商朝；盘庚把都城迁到殷，商朝又称殷朝；末代商纣王残暴。"},{label:"西周建立",text:"公元前1046年，武王伐纣，双方在牧野大战，商朝灭亡。周武王建立西周，定都镐京。"},{label:"分封制",text:"为稳定政治形势、巩固统治，周王根据血缘关系远近和功劳大小，将宗亲和功臣等分封到各地做诸侯；诸侯须向周王进献贡物、服从调兵。分封制巩固了西周的统治，扩大了统治范围。"},{label:"西周灭亡",text:"公元前771年，犬戎族攻破镐京，西周灭亡；公元前770年，周平王东迁洛邑，东周开始。"}],traps:['夏朝的建立者是禹，把王位传给启才开始世袭制——"禹建夏、启袭位"。',"牧野之战=武王伐纣；涿鹿之战=炎黄战蚩尤。两场大战别搞混。"],examTip:'分封制的目的、对象、义务是材料题常客；给一段"封建亲戚，以藩屏周"材料要会判断说的是分封制。',quiz:[{q:"我国历史上第一个王朝的建立者是（ ）",options:["黄帝","尧","禹","汤"],answer:2,explain:"约公元前2070年，禹建立夏王朝，这是我国历史上第一个王朝。"},{q:"西周实行分封制的主要目的是（ ）",options:["发展农业生产","稳定政治形势、巩固统治","促进民族交融","选拔优秀人才"],answer:1,explain:"为稳定周初的政治形势、巩固疆土，周王实行分封制。"},{q:`下列事件按时间先后排序正确的是（ ）
①武王伐纣 ②盘庚迁殷 ③禹建立夏朝 ④平王东迁`,options:["①②③④","③②①④","②③①④","③①②④"],answer:1,explain:"禹建夏（约前2070）→盘庚迁殷（商）→武王伐纣（前1046）→平王东迁（前770）。"}]},{id:"a5",no:5,title:"动荡变化中的春秋时期",art:"⚔️",mapId:"chunqiu",points:[{label:"春秋分期",text:"公元前770年—前476年为春秋时期（东周前期）。周王室衰微，诸侯不再听命于周天子，竞相争霸。"},{label:"春秋霸主",text:'齐桓公任用管仲改革，打着"尊王攘夷"的旗号，成为春秋时期第一个霸主。此后晋文公、楚庄王、秦穆公等先后称霸。'},{label:"经济发展",text:"春秋时期，铁制农具和牛耕出现，促进了农业上的深耕细作，是春秋时期农业生产力水平提高的重要标志。"},{label:"民族交融",text:"在争霸与交往中，一些强大的诸侯国疆域不断扩展，出现了大规模的民族交融。"}],traps:['铁器和牛耕"出现"在春秋，"推广"在战国——程度词要记准。','齐桓公称霸靠的是管仲改革和"尊王攘夷"，不是商鞅。'],examTip:'"铁农具和牛耕出现"是中考高频，常与"社会变革的根本原因（生产力发展）"连在一起考。',quiz:[{q:"春秋时期第一个霸主是（ ）",options:["晋文公","楚庄王","齐桓公","秦穆公"],answer:2,explain:'齐桓公任用管仲为相进行改革，以"尊王攘夷"为号召，成为春秋首霸。'},{q:"春秋时期农业生产力水平提高的重要标志是（ ）",options:["青铜农具的使用","铁制农具和牛耕的出现","都江堰的修建","筒车的发明"],answer:1,explain:"铁制农具和牛耕出现于春秋时期，使深耕细作成为可能，是生产力提高的标志。"}]},{id:"a6",no:6,title:"战国时期的社会变革",art:"🛡️",mapId:"chunqiu",points:[{label:"战国七雄",text:"公元前475—前221年为战国时期。韩、赵、魏三家分晋，田氏代齐，形成齐、楚、秦、燕、赵、魏、韩七雄并立（方位口诀：齐东楚南秦西燕北，赵魏韩在中间）。"},{label:"著名战役",text:"桂陵之战（围魏救赵）、马陵之战（减灶诱敌）、长平之战（赵括纸上谈兵，秦胜赵）。"},{label:"商鞅变法",text:"公元前356年，秦孝公任用商鞅变法。政治上确立县制、废除贵族世袭特权、改革户籍、严明法度；经济上废除井田制、允许土地自由买卖、鼓励耕织、统一度量衡；军事上奖励军功。变法使秦国国力大增，提高了军队战斗力，为以后秦统一全国奠定了基础。"},{label:"都江堰",text:'战国时期秦国蜀郡郡守李冰在岷江上主持修建都江堰，是一座综合性的水利枢纽，使成都平原成为"天府之国"。'}],traps:["商鞅变法的支持者是秦孝公；秦始皇是后来的事。",'李冰修都江堰在"秦国"，当时还是战国，不是秦朝。'],examTip:"商鞅变法内容是材料题大热门：给一段法令原文，要求指出属于政治/经济/军事哪方面措施及作用。",quiz:[{q:"战国七雄中，位于最西边的是（ ）",options:["齐国","楚国","秦国","燕国"],answer:2,explain:"按方位：齐在东、楚在南、秦在西、燕在北，赵魏韩居中。"},{q:"商鞅变法中，直接提高军队战斗力的措施是（ ）",options:["确立县制","奖励军功","统一度量衡","鼓励耕织"],answer:1,explain:"奖励军功，对有军功者授予爵位并赏赐土地，直接激发军队战斗力。"},{q:'使成都平原成为"天府之国"的水利工程是（ ）',options:["郑国渠","灵渠","大运河","都江堰"],answer:3,explain:"战国时秦国李冰主持修建都江堰，消除了岷江水患，使成都平原成为沃野。"}]},{id:"a7",no:7,title:"百家争鸣",art:"📜",points:[{label:"老子",text:'道家学派创始人，学说记录在《道德经》里。认为万物运行有其自然法则，世间事物都有对立面且可以相互转化；政治上主张"无为而治"。'},{label:"孔子",text:'儒家学派创始人，核心思想是"仁"，主张以德治国；大教育家——创办私学、主张"有教无类"、因材施教；言论由弟子整理成《论语》。'},{label:"战国诸子",text:'墨家墨子："兼爱""非攻"；儒家孟子："仁政"、民贵君轻；道家庄子：顺应自然；法家韩非：以法治国、建立中央集权专制统治。'},{label:"影响",text:"百家争鸣促进了思想和学术的繁荣，成为中国古代第一次思想文化发展的高峰，为中国古代文化的发展奠定了基础。"}],traps:["《论语》不是孔子写的，是其弟子及再传弟子整理孔子言论而成。",'"无为而治"是道家老子的主张；"以法治国"是法家韩非。'],examTip:'给一句名言判断学派是必考题型："仁者爱人"→儒家，"兼爱非攻"→墨家，"法治"→法家。',quiz:[{q:'"己所不欲，勿施于人"体现的思想核心是（ ）',options:["兼爱","仁","法治","无为"],answer:1,explain:'这句话出自《论语》，体现孔子"仁"的核心思想。'},{q:'主张"以法治国"、建立中央集权的思想家是（ ）',options:["孟子","庄子","墨子","韩非"],answer:3,explain:"韩非是法家集大成者，强调以法治国，主张建立君主专制中央集权。"}]},{id:"a8",no:8,title:"先秦时期的科技与文化",art:"🐢",points:[{label:"天文历法",text:"《诗经》中记载了公元前776年的日食，是我国历史上第一次有确切日期的日食记录；《春秋》中记载的彗星即哈雷彗星，是世界上关于哈雷彗星最早的确切记载。"},{label:"医学",text:"战国名医扁鹊总结出望、闻、问、切四种诊断疾病的方法（四诊法）；《黄帝内经》是我国现存较早的重要医学文献。"},{label:"甲骨文",text:"商周时期刻写在龟甲和兽骨上的文字。甲骨文是中国已发现的古代文字中年代最早、体系较为完整的文字；我国有文字可考的历史从商朝开始。"},{label:"青铜器",text:"商周青铜铸造业高度发达。司母戊鼎是迄今世界上出土的最重的青铜器；四羊方尊造型奇特；四川三星堆遗址出土的青铜面具等独具特色。"},{label:"《诗经》与楚辞",text:'《诗经》是我国现存第一部诗歌总集；战国时期楚国屈原创造出"楚辞"，代表作《离骚》。'}],traps:['司母戊鼎是"最重的青铜器"，不是"最早"的；四羊方尊以造型精美著称。','有文字可考的历史从"商朝"开始，不是夏朝。'],examTip:'甲骨文+青铜器常以图片题出现；"汉字演变脉络"（甲骨文→金文→小篆→隶书→楷书）也要理清。',quiz:[{q:"我国有文字可考的历史开始于（ ）",options:["夏朝","商朝","西周","春秋"],answer:1,explain:"商朝的甲骨文是已发现年代最早、体系较为完整的文字，我国有文字可考的历史从商朝开始。"},{q:"迄今世界上出土的最重的青铜器是（ ）",options:["四羊方尊","毛公鼎","司母戊鼎","青铜立人像"],answer:2,explain:"司母戊鼎重832.84千克，是迄今世界上出土的最重的青铜器。"}]}]},{id:"a-u3",title:"第三单元 秦汉时期",theme:"统一多民族封建国家的建立和巩固",color:"red",lessons:[{id:"a9",no:9,title:"秦统一中国",art:"🏯",mapId:"qin",points:[{label:"秦灭六国",text:"公元前230—前221年，秦王嬴政先后攻灭韩、赵、魏、楚、燕、齐。公元前221年建立秦朝，定都咸阳。秦的统一结束了春秋战国以来长期争战混乱的局面，建立起我国历史上第一个统一的多民族的封建国家。"},{label:"中央集权制度",text:"最高统治者称皇帝（总揽一切军政大权）；中央设丞相（行政）、太尉（军事）、御史大夫（监察）；地方推行郡县制——开创了此后我国历代王朝地方行政的基本模式。"},{label:"巩固统一的措施",text:"文化上统一文字（小篆）；经济上统一货币（圆形方孔半两钱）、统一度量衡；交通上车同轨、修驰道；军事上北击匈奴、修筑长城（西起临洮、东到辽东），南征百越、开凿灵渠。"},{label:"秦朝疆域",text:"东至东海，西到陇西，北至长城一带，南达南海，是当时世界上的大国之一。"}],traps:["秦朝都城是咸阳不是长安；秦国≠秦朝，商鞅变法在秦国，统一后才是秦朝。",'郡县制战国已有雏形，但全国推行始于秦朝，"开创地方行政基本模式"的是秦朝郡县制。'],examTip:'中考超级高频：给"统一措施"表格或图片（半两钱、小篆），要求对应领域和作用。记"皇帝—三公—郡县"三级结构图。',quiz:[{q:"我国历史上第一个统一的多民族的封建国家是（ ）",options:["夏朝","商朝","周朝","秦朝"],answer:3,explain:"公元前221年秦灭六国，建立起我国历史上第一个统一的多民族的封建国家。"},{q:"秦朝为巩固统一在经济上采取的措施是（ ）",options:["统一文字为小篆","统一货币和度量衡","修筑长城","推行郡县制"],answer:1,explain:"统一货币（圆形方孔半两钱）和度量衡属于经济措施；统一文字属文化，郡县制属政治。"},{q:"秦朝御史大夫的职责是（ ）",options:["掌管行政","掌管军事","负责监察百官","管理财政"],answer:2,explain:'丞相掌行政、太尉掌军事、御史大夫掌监察，合称"三公"。'}]},{id:"a10",no:10,title:"秦末农民大起义",art:"🔥",points:[{label:"秦的暴政",text:'赋税沉重；徭役、兵役繁重；法律严苛、刑罚残酷；"焚书坑儒"禁锢思想；秦二世更加残暴。'},{label:"陈胜吴广起义",text:'公元前209年，陈胜、吴广在大泽乡起义，高呼"王侯将相，宁有种乎！"——这是中国历史上第一次农民大起义，建立了"张楚"政权。'},{label:"秦朝灭亡",text:"项羽在巨鹿之战中以少胜多，歼灭秦军主力（破釜沉舟）；公元前207年，刘邦率军直抵咸阳，秦朝灭亡。"},{label:"楚汉之争",text:'秦朝灭亡后，刘邦和项羽为争夺帝位展开四年"楚汉之争"，最终刘邦在垓下之战取胜（四面楚歌）。'}],traps:["灭亡秦朝的是刘邦（入咸阳），不是项羽；项羽赢在巨鹿歼灭秦军主力。",'大泽乡起义是"第一次农民大起义"，黄巾起义是"有组织有准备"的起义。'],examTip:'常考"成语典故对应战役"：破釜沉舟→巨鹿之战，四面楚歌→垓下之战，纸上谈兵→长平之战。',quiz:[{q:"中国历史上第一次农民大起义是（ ）",options:["黄巾起义","陈胜吴广起义","黄巢起义","李自成起义"],answer:1,explain:"公元前209年陈胜、吴广在大泽乡起义，是中国历史上第一次农民大起义。"},{q:'成语"破釜沉舟"出自下列哪次战役（ ）',options:["长平之战","巨鹿之战","官渡之战","赤壁之战"],answer:1,explain:"巨鹿之战中项羽破釜沉舟，以少胜多大败秦军主力。"}]},{id:"a11",no:11,title:'西汉建立和"文景之治"',art:"🕊️",points:[{label:"西汉建立",text:"公元前202年，刘邦建立汉朝，定都长安，史称西汉。刘邦就是汉高祖。"},{label:"休养生息",text:"汉初经济凋敝，统治者吸取秦亡教训，实行休养生息政策：让士兵还乡务农、释放奴婢、轻徭薄赋，使经济逐渐恢复。"},{label:"文景之治",text:'汉文帝、汉景帝继续推行休养生息政策，注重农业生产、减轻赋税徭役、"以德化民"。这一时期政治清明、经济发展、人民生活安定，史称"文景之治"。'}],traps:['西汉都城长安，东汉都城洛阳——"西长安，东洛阳"。','"文景之治"是治世，"光武中兴"在东汉，"贞观之治"在唐朝，别记串。'],examTip:'"休养生息政策"常结合"秦亡教训"考原因；注意治世局面与皇帝的正确搭配。',quiz:[{q:'"文景之治"出现在（ ）',options:["秦朝","西汉","东汉","唐朝"],answer:1,explain:'汉文帝、汉景帝时期推行休养生息政策，出现"文景之治"的治世局面。'},{q:"汉初实行休养生息政策的根本原因是（ ）",options:["皇帝个人仁慈","经济凋敝、巩固统治","儒家思想影响","抵御匈奴需要"],answer:1,explain:"秦末战乱使社会经济严重破坏，为恢复经济、巩固统治，汉初统治者实行休养生息。"}]},{id:"a12",no:12,title:"大一统王朝的巩固",art:"🐎",mapId:"sichou",points:[{label:"政治：推恩令",text:'汉武帝采纳主父偃建议颁布"推恩令"，使诸侯王的封地和势力越来越小；还建立刺史制度，监视地方官吏豪强——中央对地方的控制大大加强。'},{label:"思想：尊崇儒术",text:'接受董仲舒建议，"罢黜百家，尊崇儒术"，把儒家学说立为正统思想；在长安兴办太学，以儒家五经为教材。'},{label:"经济：盐铁专卖",text:"把铸币权收归中央，统一铸造五铢钱；实行盐铁官营、专卖；调配物资、平抑物价。"},{label:"军事：北击匈奴",text:"公元前119年，卫青、霍去病在漠北战役中大败匈奴，匈奴再无力与西汉对抗。"},{label:"张骞通西域",text:"公元前138年、公元前119年，汉武帝两次派张骞出使西域，促进了汉朝与西域的相互了解与往来。"},{label:"总评",text:"汉武帝从政治、思想、经济、军事等方面巩固了大一统局面，使西汉王朝开始进入鼎盛时期。"}],traps:["出主意的人：推恩令→主父偃，尊崇儒术→董仲舒，别写反。",'统一铸造的是"五铢钱"；秦朝是"半两钱"——秦半两、汉五铢。'],examTip:'中考最爱出"措施+作用"连线材料题。记四维框架：政治推恩、思想尊儒、经济盐铁、军事击匈。',quiz:[{q:"汉武帝为削弱诸侯王势力而采取的措施是（ ）",options:["实行郡县制","颁布推恩令","设置刺史","盐铁专卖"],answer:1,explain:'汉武帝采纳主父偃的建议颁布"推恩令"，诸侯王封地越来越小，中央集权加强。'},{q:'"罢黜百家，尊崇儒术"的建议者是（ ）',options:["主父偃","董仲舒","司马迁","张骞"],answer:1,explain:'董仲舒建议"罢黜百家，尊崇儒术"，使儒家学说成为封建社会的正统思想。'},{q:"公元前119年，大败匈奴的西汉名将是（ ）",options:["卫青、霍去病","李广、卫青","霍去病、班超","蒙恬、卫青"],answer:0,explain:"公元前119年漠北战役，卫青、霍去病大破匈奴主力。"}]},{id:"a13",no:13,title:"东汉的兴衰",art:"🏮",points:[{label:"东汉建立",text:"公元9年王莽建立新朝，西汉灭亡。公元25年，刘秀称帝，定都洛阳，史称东汉，刘秀就是光武帝。"},{label:"光武中兴",text:'光武帝多次下令释放奴婢、减轻刑罚、合并郡县、裁减官员、允许北方少数民族内迁，社会安定、经济恢复，史称"光武中兴"。'},{label:"外戚宦官交替专权",text:"东汉中期以后，皇帝年幼，形成外戚与宦官交替专权的局面，导致政治腐朽、社会混乱。"},{label:"黄巾起义",text:"184年，张角以太平道组织发动黄巾起义，是一场有组织、有准备的农民大起义，沉重打击了东汉的统治。"}],traps:['东汉建立者是刘秀（光武帝），西汉是刘邦，蜀汉是刘备——三个"刘"分清。','黄巾起义"有组织有准备"；大泽乡起义是"第一次"——各记各的标签。'],examTip:"东汉衰亡链条常考排序：外戚宦官专权→政治腐败→黄巾起义→州牧割据。",quiz:[{q:'"光武中兴"的缔造者是（ ）',options:["刘邦","刘彻","刘秀","刘备"],answer:2,explain:'光武帝刘秀建立东汉，其统治时期社会安定、经济恢复，史称"光武中兴"。'},{q:"东汉后期政治上的突出特点是（ ）",options:["诸侯争霸","外戚宦官交替专权","藩镇割据","八王之乱"],answer:1,explain:"东汉中期以后形成外戚与宦官交替专权的局面，导致政治腐朽。"}]},{id:"a14",no:14,title:"丝绸之路的开通与经营西域",art:"🐫",mapId:"sichou",points:[{label:"西域",text:"汉代人把今天甘肃阳关、玉门关以西，也就是现在新疆和更远的广大地区称为西域。"},{label:"张骞通西域",text:"汉武帝两次派张骞出使西域（前138年、前119年），开辟了通往西域的道路，促进了汉朝与西域各国的相互了解与往来。"},{label:"丝绸之路",text:'商人们载着汉朝的丝绸等货物，从长安出发，穿过河西走廊，经西域运往中亚、西亚，再转运到欧洲，这条沟通欧亚的陆上交通道路就是"丝绸之路"。核桃、葡萄、石榴、苜蓿、良种马、香料、玻璃等传入中原。'},{label:"海上丝绸之路",text:'汉武帝时还大力开辟海上交通，形成"海上丝绸之路"。'},{label:"西域都护",text:"公元前60年，西汉朝廷设置西域都护，标志着西域正式归属中央政权（今新疆地区开始隶属中央政府的管辖）。东汉班超经营西域30年，派甘英出使大秦。"}],traps:["丝绸之路开辟者是张骞（西汉），不是班超（东汉经营西域）。",'西域都护设置于"公元前60年西汉"，意义是"新疆正式归属中央政权"。'],examTip:'丝绸之路路线图是地图题常客：长安→河西走廊→西域→中亚西亚→欧洲；"传入中原的物种"也高频。',quiz:[{q:"标志着西域正式归属中央政权的事件是（ ）",options:["张骞出使西域","设置西域都护","班超经营西域","昭君出塞"],answer:1,explain:"公元前60年西汉设置西域都护，标志着西域（今新疆）正式归属中央政权。"},{q:"下列物品中，通过丝绸之路传入中原的是（ ）",options:["丝绸","瓷器","葡萄","茶叶"],answer:2,explain:"葡萄、核桃、石榴、苜蓿等经丝绸之路传入中原；丝绸、瓷器是中原输出的。"}]},{id:"a15",no:15,title:"秦汉时期的科技与文化",art:"📄",points:[{label:"造纸术",text:'西汉时期人们已经懂得了造纸的基本方法；东汉蔡伦改进造纸术（"蔡侯纸"）。造纸术的发明便利了典籍的流传，是中国对世界文明的伟大贡献之一。'},{label:"医学",text:'张仲景写成《伤寒杂病论》，提出"治未病"，被尊为"医圣"；华佗发明"麻沸散"、创编"五禽戏"。'},{label:"史学",text:'司马迁所著《史记》是我国第一部纪传体通史，记述了从传说中的黄帝到汉武帝时约3000年的史事，被鲁迅誉为"史家之绝唱，无韵之《离骚》"。'},{label:"宗教",text:"西汉末年，佛教通过丝绸之路传入中原地区；东汉时道教产生（太平道、五斗米道）。"}],traps:['蔡伦是"改进"造纸术，不是"发明"——西汉时已有纸。',"《史记》是纪传体通史；《资治通鉴》是编年体通史（宋代司马光）。"],examTip:'"人物+著作+地位"三件套必须背熟：蔡伦、张仲景、华佗、司马迁是选择题常客。',quiz:[{q:'被鲁迅誉为"史家之绝唱，无韵之《离骚》"的史学著作是（ ）',options:["《春秋》","《史记》","《汉书》","《资治通鉴》"],answer:1,explain:"司马迁的《史记》是我国第一部纪传体通史，兼具史学与文学价值。"},{q:"下列人物与成就对应错误的是（ ）",options:["蔡伦——改进造纸术","张仲景——《伤寒杂病论》","华佗——麻沸散","司马迁——《九章算术》"],answer:3,explain:"司马迁的著作是《史记》；《九章算术》是数学著作，与司马迁无关。"}]}]},{id:"a-u4",title:"第四单元 三国两晋南北朝时期",theme:"孕育统一和民族交融",color:"blue",lessons:[{id:"a16",no:16,title:"三国鼎立",art:"⚖️",mapId:"sanguo",points:[{label:"官渡之战",text:"200年，曹操在官渡以少胜多打败袁绍，为以后统一北方奠定基础。"},{label:"赤壁之战",text:"208年，孙刘联军在赤壁以少胜多大败曹操。赤壁之战为三国鼎立局面的形成奠定了基础。"},{label:"三国鼎立形成",text:"220年曹丕在洛阳称帝建魏（东汉灭亡）；221年刘备在成都称帝建蜀汉；229年孙权称帝建吴，定都建业——三国鼎立局面形成。"},{label:"三国经济发展",text:"曹魏重视农业、兴修水利；蜀汉发展经济、改善民族关系；孙吴造船业发达，230年孙权派卫温率船队到达夷洲（今台湾），加强了大陆与台湾的联系。"}],traps:["曹丕建魏，曹操没有称帝——曹操是东汉末年人，不是三国人。","三国建国顺序：魏（220）→蜀（221）→吴（229），都城：洛阳—成都—建业。"],examTip:'两次"以少胜多"战役的影响是高频考点：官渡→统一北方，赤壁→三国鼎立。',quiz:[{q:"为三国鼎立局面形成奠定基础的战役是（ ）",options:["官渡之战","赤壁之战","巨鹿之战","淝水之战"],answer:1,explain:"208年赤壁之战孙刘联军大败曹操，为三国鼎立局面的形成奠定了基础。"},{q:"三国时期，派卫温率船队到达夷洲（今台湾）的是（ ）",options:["曹操","刘备","孙权","曹丕"],answer:2,explain:"230年孙权派卫温率万人船队到达夷洲，加强了大陆与台湾的联系。"}]},{id:"a17",no:17,title:"西晋的短暂统一和北方各族的内迁",art:"🌊",points:[{label:"西晋统一",text:"263年魏灭蜀；266年司马炎建立西晋，定都洛阳；280年西晋灭吴，统一全国。"},{label:"八王之乱",text:'晋惠帝时期，八个宗室亲王为争夺中央政权混战十几年，史称"八王之乱"。西晋从此衰落，并形成我国古代历史上第一次大规模的人口迁徙高潮（中原人口南迁）。'},{label:"北方各族内迁",text:"东汉、魏、晋时期，匈奴、鲜卑、羯、氐、羌等北方和西方的少数民族陆续内迁，与汉族杂居。"},{label:"西晋灭亡与十六国",text:'316年，西晋被匈奴人建立的政权所灭。此后北方先后出现许多政权，总称"十六国"；前秦苻坚一度统一黄河流域。'}],traps:['"八王之乱"在西晋；"七国之乱"在西汉——一字之差，朝代不同。',"我国古代第一次大规模人口迁徙高潮出现在西晋末年（八王之乱后）。"],examTip:'"人口南迁"是连接第18课江南开发的关键线索，常与"经济重心南移开端"一起考。',quiz:[{q:"西晋灭亡后，我国古代历史上第一次大规模人口迁徙的方向是（ ）",options:["由南向北","由北向南","由东向西","由西向东"],answer:1,explain:"八王之乱后中原人口大量南迁，形成第一次大规模人口迁徙高潮。"},{q:"导致西晋由盛转衰的事件是（ ）",options:["七国之乱","八王之乱","黄巾起义","安史之乱"],answer:1,explain:'晋惠帝时的"八王之乱"历时十几年，西晋从此衰落。'}]},{id:"a18",no:18,title:"东晋南朝政治和江南地区开发",art:"🌿",points:[{label:"东晋建立",text:"317年，司马睿重建晋王朝，定都建康，史称东晋。420年，东晋灭亡。"},{label:"南朝更替",text:'420—589年，南方相继出现宋、齐、梁、陈四个王朝，都在建康定都，历史上统称为"南朝"。'},{label:"江南开发的原因",text:"北方人的南迁给江南地区输送了大量劳动力，也带来了中原先进的生产工具和生产技术（最主要原因）；江南自然条件优越；社会比较安定；南下移民和当地民众的共同努力。"},{label:"江南开发的表现与影响",text:"农业上开垦荒地、兴修水利、推广改进犁耕、水稻育秧移栽、麦稻兼作；手工业上缫丝、织布、制瓷、冶铸、造纸等都有显著发展。江南地区的开发为经济重心的南移奠定了基础。"}],traps:['江南开发"最主要原因"是北人南迁带来劳动力和技术，自然条件只是客观条件。','此时江南是"开发"，经济重心"完成南移"要到南宋——程度分清。'],examTip:'材料题给"户口数对比"或"火耕水耨→良田美池"材料，要求分析江南开发的原因和影响。',quiz:[{q:"东晋南朝时期江南地区得以开发的最主要原因是（ ）",options:["南方自然条件优越","北方人口南迁带来劳动力和技术","南方社会安定","统治者重视"],answer:1,explain:"北人南迁输送了大量劳动力和中原先进的生产工具、技术，是江南开发的最主要原因。"},{q:"南朝包括的朝代是（ ）",options:["宋齐梁陈","宋元明清","魏晋南北朝","隋唐五代"],answer:0,explain:'420—589年南方相继出现宋、齐、梁、陈四个王朝，统称"南朝"，都定都建康。'}]},{id:"a19",no:19,title:"北朝政治和北方民族大交融",art:"🤝",points:[{label:"淝水之战",text:"383年，东晋以少胜多，在淝水之战中大败前秦。前秦很快瓦解，北方再度陷入分裂和混战的状态。"},{label:"北魏统一北方",text:"439年，鲜卑族拓跋部建立的北魏统一北方，结束了十六国以来的分裂割据局面。"},{label:"孝文帝改革",text:"494年北魏孝文帝迁都洛阳；推行汉化措施：说汉语、穿汉服、改汉姓、鼓励与汉族联姻。改革促进了民族交融，也增强了北魏的实力。"},{label:"民族交融的意义",text:"北方地区民族的交往交流交融，为中华民族的发展注入了新的活力，进一步丰富了中华民族的物质文化和精神文化，并为隋唐时期多民族国家的繁荣与发展奠定了基础。"}],traps:['淝水之战是"东晋vs前秦"，不是南北朝之间；成语：投鞭断流、草木皆兵、风声鹤唳。','孝文帝是鲜卑族皇帝，改革方向是"汉化"，目的之一是加强对中原的统治。'],examTip:'孝文帝改革措施与作用是中考高频材料题；"胡人汉服、汉人胡食"类图片用来判断民族交融。',quiz:[{q:`北魏孝文帝改革中，属于汉化措施的是（ ）
①说汉语 ②穿汉服 ③改汉姓 ④奖励军功`,options:["①②③","①②④","①③④","②③④"],answer:0,explain:"说汉语、穿汉服、改汉姓、与汉族联姻都是孝文帝汉化措施；奖励军功是商鞅变法内容。"},{q:"383年淝水之战的交战双方是（ ）",options:["西晋与前秦","东晋与前秦","北魏与东晋","前秦与北魏"],answer:1,explain:"383年东晋在淝水以少胜多大败前秦，前秦瓦解，北方再度分裂。"}]},{id:"a20",no:20,title:"三国两晋南北朝时期的科技与文化",art:"🖌️",points:[{label:"祖冲之",text:"南朝科学家，把圆周率精确到小数点以后的第七位数字，领先世界近千年；创制当时最先进的历法《大明历》。"},{label:"贾思勰",text:"北朝农学家，所著《齐民要术》是我国现存最早的一部完整的农书，总结了农林牧副渔等方面的生产技术。"},{label:"书法艺术",text:'曹魏锺繇独创楷书书法；东晋王羲之的《兰亭集序》被称为"天下第一行书"，王羲之被尊为"书圣"。'},{label:"绘画与石窟",text:"东晋顾恺之代表作《女史箴图》《洛神赋图》；南北朝石窟艺术代表：山西大同云冈石窟、河南洛阳龙门石窟。"}],traps:['"书圣"王羲之写《兰亭集序》；顾恺之是画家——一书一画别混。',"云冈石窟在山西大同，龙门石窟在河南洛阳，与孝文帝迁都路线一致。"],examTip:'"人物+成就+地位"表格题：祖冲之（圆周率第七位）、贾思勰（最早完整农书）几乎必考其一。',quiz:[{q:"把圆周率精确到小数点后第七位的科学家是（ ）",options:["贾思勰","祖冲之","郦道元","张衡"],answer:1,explain:"南朝祖冲之把圆周率精确到3.1415926和3.1415927之间，领先世界近千年。"},{q:"我国现存最早的一部完整的农书是（ ）",options:["《伤寒杂病论》","《水经注》","《齐民要术》","《农政全书》"],answer:2,explain:"北朝贾思勰的《齐民要术》是我国现存最早的一部完整的农书；《农政全书》是明代徐光启所著。"}]}]}]},Fm={id:"7b",title:"七年级下册",subtitle:"中国古代史 · 下（隋唐 → 明清）",cover:"🏮",units:[{id:"b-u1",title:"第一单元 隋唐时期",theme:"繁荣与开放的时代",color:"red",lessons:[{id:"b1",no:1,title:"隋朝统一与灭亡",art:"🌉",mapId:"yunhe",points:[{label:"隋朝统一",text:"581年杨坚（隋文帝）建立隋朝，定都长安。589年隋灭陈，统一全国，结束了长期分裂的局面，顺应了统一多民族国家的历史发展大趋势。"},{label:"开皇之治",text:'隋文帝励精图治：发展经济、编订户籍、统一南北币制和度量衡制度；加强中央集权、提高行政效率，形成"开皇之治"的繁盛局面。'},{label:"开通大运河",text:"605年起，隋炀帝利用已有的经济实力开通大运河。目的：加强南北交通，巩固隋王朝对全国的统治。概况：以洛阳为中心，北抵涿郡、南至余杭，自北向南分为永济渠、通济渠、邗沟、江南河四段，连接海河、黄河、淮河、长江、钱塘江五大水系，全长2700多千米。作用：加强了南北地区政治、经济和文化交流。"},{label:"科举取士制度",text:"隋文帝初步建立起通过考试选拔人才的制度；隋炀帝时创立进士科，标志着科举制度正式确立。科举制加强了皇帝在选官和用人上的权力，扩大了官吏选拔范围，使有才学的人能够由此参政。"},{label:"隋朝灭亡",text:"隋炀帝好大喜功、不恤民力（三征辽东、营建东都、巡游无度），导致大规模农民起义。618年，隋炀帝在江都被叛军杀死，隋朝灭亡。"}],traps:['大运河是隋炀帝开通的，"开皇之治"是隋文帝——父子俩的事别混。','科举"正式确立"的标志是隋炀帝设进士科，不是隋文帝的考试选官。'],examTip:'大运河"一个中心、两个端点、四段、五河"是地图题标配；评价大运河要会"一分为二"（交流+徭役）。',quiz:[{q:"隋朝大运河的中心是（ ）",options:["长安","洛阳","涿郡","余杭"],answer:1,explain:"大运河以洛阳为中心，北抵涿郡、南至余杭。"},{q:"标志着科举制度正式确立的事件是（ ）",options:["隋文帝用考试选拔人才","隋炀帝创立进士科","唐太宗增加考试科目","武则天创立殿试"],answer:1,explain:"隋炀帝时进士科的创立，标志着科举制度正式确立。"},{q:"隋朝与下列哪个朝代最相似：都结束了分裂、都因暴政二世而亡（ ）",options:["西汉","秦朝","西晋","元朝"],answer:1,explain:"秦和隋都结束了长期分裂局面、都开创了对后世影响深远的制度、都因暴政短命而亡。"}]},{id:"b2",no:2,title:'唐朝建立与"贞观之治"',art:"🐉",points:[{label:"唐朝建立",text:'618年，李渊建立唐朝，定都长安。626年，李世民即位，他就是唐太宗，年号"贞观"。'},{label:"贞观之治",text:'唐太宗吸取隋朝速亡的历史教训，勤于政事、虚心纳谏（魏征被喻为"知得失的镜子"）、知人善任（房玄龄、杜如晦，人称"房谋杜断"）。政治上完善三省六部制、制定法律减省刑罚、增加科举考试科目、严格考察官吏；经济上减轻人民的劳役负担、鼓励发展农业生产。贞观年间政治比较清明、经济得到进一步发展，国力增强、文教昌盛，史称"贞观之治"。'},{label:"武则天",text:'她是中国历史上唯一的女皇帝。创立殿试制度，继续推行贞观以来减轻人民负担的政策和措施，重视发展生产。其统治"政启开元，治宏贞观"，为后来"开元盛世"局面的出现奠定了基础。'}],traps:['"贞观"是唐太宗的年号；"开元"是唐玄宗的年号。','魏征以进谏著称于唐太宗朝，"房谋杜断"指房玄龄和杜如晦。'],examTip:'"吸取隋亡教训→以民为本"是理解贞观之治的逻辑主线，材料题爱考"舟所以比人君，水所以比黎庶"。',quiz:[{q:'被唐太宗比喻为可以"知得失"的一面镜子的是（ ）',options:["房玄龄","杜如晦","魏征","姚崇"],answer:2,explain:'魏征敢于直言进谏，唐太宗把他比作一面"知得失"的镜子。'},{q:"中国历史上唯一的女皇帝是（ ）",options:["吕后","武则天","慈禧太后","孝庄皇后"],answer:1,explain:'武则天是中国历史上唯一的女皇帝，创立殿试制度，其统治"政启开元，治宏贞观"。'}]},{id:"b3",no:3,title:"开元盛世",art:"🌟",points:[{label:"开元盛世",text:'唐玄宗即位以后，稳定政局、励精图治、重用贤能（姚崇、宋璟），进行一系列改革。开元年间政治稳定、经济繁荣、国库充盈、民众生活安定，唐朝的国力达到前所未有的强大，进入了鼎盛时期，历史上称为"开元盛世"。'},{label:"经济繁荣",text:"农业：发明并推广曲辕犁和筒车等生产工具；手工业：蜀锦冠于全国，越窑青瓷如冰如玉、邢窑白瓷类雪似银，唐三彩闻名中外；商业：商业繁荣，出现了一些繁华的大都市。"},{label:"国际大都市长安",text:"唐都长安规划整齐、规模宏伟，有宫城、皇城和外郭城，坊市分明，既是当时中国政治、经济和文化交往的中心，也是一座国际性的大都会。"}],traps:['唐朝"鼎盛"在开元盛世，不是贞观之治；贞观是"治世"，开元是"盛世"。',"曲辕犁是耕地工具、筒车是灌溉工具，用途别写反。"],examTip:'唐朝治世排序题常见：贞观之治→武则天"政启开元"→开元盛世。长安城布局常配图片题。',quiz:[{q:"唐朝进入鼎盛时期是在（ ）",options:["贞观年间","武则天时期","开元年间","天宝年间"],answer:2,explain:'唐玄宗开元年间，唐朝国力达到前所未有的强大，进入鼎盛时期，史称"开元盛世"。'},{q:"唐朝时期发明并推广的灌溉工具是（ ）",options:["曲辕犁","筒车","耧车","翻车"],answer:1,explain:"筒车是唐朝发明的灌溉工具；曲辕犁是耕作工具。"}]},{id:"b4",no:4,title:"安史之乱与唐朝衰亡",art:"🥀",points:[{label:"安史之乱",text:'开元末年以后，唐玄宗追求享乐、任人唯亲，朝政日趋腐败。755年，安禄山、史思明发动叛乱，史称"安史之乱"，763年被平定。影响：唐朝的国势从此由盛转衰，逐渐形成藩镇割据的局面。'},{label:"黄巢起义",text:"唐朝后期，黄巢领导农民起义，攻入长安、建立政权，给唐朝统治以致命的打击。"},{label:"唐朝灭亡",text:"907年，朱温建立后梁政权，唐朝至此灭亡。"},{label:"五代十国",text:'唐朝灭亡后，北方先后出现后梁、后唐、后晋、后汉、后周五个政权，南方出现九个政权加上北汉，史称"五代十国"。其实质是唐末以来藩镇割据局面的延续；虽然政权分立，但统一始终是一个客观存在的必然趋势。'}],traps:['安史之乱使唐朝"由盛转衰"，黄巢起义给唐朝"致命打击"，朱温灭唐——三步分清。',"五代在北方更替，十国多在南方并存，不是简单的前后相继。"],examTip:'"由盛转衰的转折点"是标准表述；五代十国实质（藩镇割据延续）是理解型考点。',quiz:[{q:"唐朝由盛转衰的转折点是（ ）",options:["七国之乱","安史之乱","黄巢起义","藩镇割据"],answer:1,explain:"安史之乱持续八年，使唐朝国势由盛转衰，此后形成藩镇割据局面。"},{q:"五代十国局面的实质是（ ）",options:["民族政权并立","唐末藩镇割据局面的延续","农民起义的结果","外族入侵的产物"],answer:1,explain:"五代十国是唐末以来藩镇割据局面的延续，但统一始终是历史发展的必然趋势。"}]},{id:"b5",no:5,title:"隋唐时期的民族交往与交融",art:"🕊️",points:[{label:"开明民族政策",text:'唐太宗实行开明的民族政策，得到周边各族的拥戴，被尊奉为各族的"天可汗"。'},{label:"文成公主入藏",text:"唐太宗时，文成公主嫁给吐蕃赞普松赞干布。唐蕃和亲促进了吐蕃经济和社会的发展，增进了汉藏两族的友好关系。"},{label:"唐蕃友好往来",text:'唐中宗时金城公主嫁给尺带珠丹；唐穆宗时唐蕃订立友好盟约，立"唐蕃会盟碑"。'},{label:"管辖与册封",text:"唐朝先后设置安西都护府和北庭都护府，管辖西域的天山南北地区；唐玄宗册封渤海国首领为渤海郡王、回纥首领为怀仁可汗、南诏首领为云南王。"}],traps:["嫁文成公主的是唐太宗，迎娶者是松赞干布；金城公主是唐中宗时。",'"天可汗"是唐太宗的称号，不是唐玄宗。'],examTip:"文成公主入藏的意义是固定答题模板：促进吐蕃发展+增进汉藏友好。常配《步辇图》考阎立本。",quiz:[{q:"唐太宗被周边各族尊奉为（ ）",options:["天可汗","怀仁可汗","渤海郡王","赞普"],answer:0,explain:'唐太宗实行开明的民族政策，被周边各族尊奉为"天可汗"。'},{q:"文成公主入藏嫁给了吐蕃赞普（ ）",options:["尺带珠丹","松赞干布","皮逻阁","怀仁可汗"],answer:1,explain:"唐太宗把文成公主嫁给松赞干布，唐蕃和亲促进了吐蕃经济和社会发展。"}]},{id:"b6",no:6,title:"隋唐时期的中外文化交流",art:"⛵",mapId:"tang",points:[{label:"遣隋使与遣唐使",text:"隋唐时期，日本多次派遣使者到中国学习，他们把唐朝先进的制度、天文历法、文字、典籍、书法艺术、建筑艺术等传回日本，对日本社会的发展产生了深远的影响。"},{label:"鉴真东渡",text:"唐玄宗时，高僧鉴真六次东渡，终于在754年抵达日本。他在日本传授佛经，还传播中国的医药、文学、书法、建筑、绘画等，主持修建唐招提寺，为中日文化交流作出了卓越的贡献。"},{label:"玄奘西行",text:"贞观初年，高僧玄奘西行前往天竺取经。他遍访天竺名寺、研习佛法，曾在佛学最高学府那烂陀寺游学，成为远近闻名的佛学大师。回国后主持译经工作，为中国佛教的发展作出重大贡献；根据他的口述，由弟子记录成书的《大唐西域记》，是研究中外交流史的珍贵文献。"},{label:"唐与新罗",text:"新罗派遣使节和留学生到唐朝学习，新罗物产居唐朝进口首位；新罗仿唐制建立政治制度、采用科举制选拔官吏。"},{label:"唐的世界地位",text:'唐朝在世界上声望很高，各国称中国人为"唐人"。'}],traps:["鉴真东渡在唐玄宗时，玄奘西行在唐太宗（贞观）时——一东一西、一僧一僧，时代不同。","《大唐西域记》是玄奘口述、弟子记录，不是玄奘亲笔写的游记。"],examTip:'"开放的时代"单元核心：双向交流（遣唐使来学、鉴真玄奘出去）。图片题常考唐招提寺和那烂陀寺。',quiz:[{q:"为中日文化交流作出卓越贡献的唐朝高僧是（ ）",options:["玄奘","鉴真","一行","法显"],answer:1,explain:"鉴真六次东渡日本，传播唐朝文化，主持修建唐招提寺。"},{q:"《大唐西域记》记述了玄奘西行亲历的100多个国家和地区的山川风物及社会习俗，其研究价值是（ ）",options:["研究中亚、印度半岛历史和佛学的重要典籍","研究日本历史的唯一文献","研究西藏历史的典籍","研究新罗历史的典籍"],answer:0,explain:"《大唐西域记》记载玄奘西行见闻，是研究中外交流史（尤其是中亚、印度半岛）的珍贵文献。"}]},{id:"b7",no:7,title:"隋唐时期的科技与文化",art:"🎨",points:[{label:"唐诗",text:'唐朝是我国诗歌创作的黄金时代。李白诗风豪迈奔放、清新飘逸，被誉为"诗仙"；杜甫诗风沉郁顿挫，其诗反映社会现实，被称为"诗史"，他被尊为"诗圣"；白居易的诗平易近人、通俗易懂。'},{label:"书法与绘画",text:'书法：颜真卿（字端正劲美、雄浑敦厚，《颜勤礼碑》）、柳公权（方折峻丽、笔力劲健）、欧阳询；绘画：阎立本（《步辇图》）、吴道子（落笔雄劲、风格奔放，被尊为"画圣"，《送子天王图》）。'},{label:"石窟艺术",text:"甘肃敦煌莫高窟大部分洞窟开凿于隋唐时期，窟内有大量精美的壁画和彩塑，堪称世界最大的艺术宝库之一。"},{label:"科技",text:'隋唐时期发明雕版印刷术；《金刚经》是世界上现存最早的、标有确切日期的雕版印刷品。天文学家僧一行在世界上首次测算出地球子午线的长度。医学家孙思邈著《千金方》，被后世尊为"药王"；唐高宗时编修的《唐本草》，是世界上第一部由国家编定和颁布的药典。'}],traps:['"诗仙"李白、"诗圣"杜甫、"画圣"吴道子、"书圣"王羲之（东晋）——圣人别配错朝代。',"雕版印刷术发明于隋唐；活字印刷术是北宋毕昇发明。"],examTip:'科技文化类题目注意"世界之最"：最早标有确切日期的雕版印刷品、第一部国家药典、首次实测子午线。',quiz:[{q:'其诗反映社会现实、被称为"诗史"的诗人是（ ）',options:["李白","杜甫","白居易","王维"],answer:1,explain:'杜甫的诗记录社会现实，被称为"诗史"，他被尊为"诗圣"。'},{q:"世界上现存最早的、标有确切日期的雕版印刷品是（ ）",options:["《金刚经》","《千金方》","《唐本草》","《大唐西域记》"],answer:0,explain:"唐朝印制的《金刚经》是世界上现存最早的、标有确切日期的雕版印刷品。"}]}]},{id:"b-u2",title:"第二单元 辽宋夏金元时期",theme:"民族关系发展和社会变化",color:"blue",lessons:[{id:"b8",no:8,title:"北宋的政治",art:"🍶",points:[{label:"北宋建立",text:'960年，后周大将赵匡胤在陈桥驿发动兵变（"黄袍加身"），建立北宋，定都东京（开封），他就是宋太祖。北宋结束了中原和南方的分裂割据局面（局部统一）。'},{label:"强化中央集权",text:'军事上：解除禁军高级将领的兵权（"杯酒释兵权"），控制对军队的调动，经常调换军队将领、定期换防。政治上：在中央分化事权、削弱相权；在地方派文臣担任各地州县的长官，设通判以分知州的权力。经济上：取消节度使收税的权力，设转运使把地方财赋收归中央。'},{label:"重文轻武政策",text:"为防止唐末以来武将专横跋扈的弊端重现，宋太祖有意重用文臣掌握军政大权；后继的宋太宗继续采取抑制武将、提升文官地位的政策。宋朝注重发展文教事业，改革和发展了科举制。影响：扭转了五代十国时期尚武轻文的风气，杜绝了武将跋扈和兵变政移的情况发生，有利于政权的稳固和社会的安定。"}],traps:['北宋只是"局部统一"，没有统一全国——北方有辽、西北有西夏并立。',"重文轻武有利于政权稳固，但也造成官僚机构臃肿、军队战斗力弱（积贫积弱）。"],examTip:'"杯酒释兵权""重文轻武"是选择题高频；材料题会让评价重文轻武政策的利弊两面。',quiz:[{q:'"杯酒释兵权"的皇帝是（ ）',options:["唐太宗","宋太祖","明太祖","康熙帝"],answer:1,explain:'宋太祖赵匡胤通过"杯酒释兵权"解除禁军高级将领兵权，加强中央集权。'},{q:"北宋在地方设置转运使的主要目的是（ ）",options:["监视知州","把地方财赋收归中央","管理对外贸易","主持科举考试"],answer:1,explain:"转运使负责把地方财赋收归中央，消除地方割据的物质基础。"}]},{id:"b9",no:9,title:"辽、西夏与北宋并立",art:"🏹",mapId:"song",points:[{label:"辽的建立",text:"10世纪初，契丹族首领耶律阿保机统一契丹各部，建立契丹国（后改称辽），都城在上京临潢府。"},{label:"澶渊之盟",text:'1004年辽军大举攻宋，宰相寇准力劝宋真宗亲征，宋军士气大振，打退辽军。1005年辽宋议和：辽军撤回，宋朝给辽岁币，史称"澶渊之盟"。此后很长时间，辽宋之间保持着和平局面。'},{label:"西夏建立与宋夏议和",text:"11世纪前期，党项族首领元昊称大夏皇帝，定都兴庆府，史称西夏。宋夏议和：元昊向宋称臣，宋给西夏岁币。议和后，宋夏边界贸易兴旺。"}],traps:['澶渊之盟的内容是"宋给辽岁币"，岁币≠战争赔款，换得的是长期和平。',"辽是契丹族、西夏是党项族、金是女真族——民族与政权对应要记牢。"],examTip:'评价"澶渊之盟"要辩证：加重财政负担，但换来了辽宋长期和平、促进交流。',quiz:[{q:"澶渊之盟订立后，辽宋之间（ ）",options:["战争不断","保持长期和平局面","立即联合灭金","以黄河为界"],answer:1,explain:"澶渊之盟后很长时间，辽宋之间保持和平局面，边境贸易兴旺。"},{q:"建立西夏政权的少数民族是（ ）",options:["契丹族","党项族","女真族","蒙古族"],answer:1,explain:"11世纪前期，党项族首领元昊建立西夏，定都兴庆府。"}]},{id:"b10",no:10,title:"金与南宋对峙",art:"🌊",mapId:"song",points:[{label:"金的建立与灭辽、北宋",text:'1115年，女真族首领完颜阿骨打建立金，定都会宁。1125年辽被金灭亡；1127年金军攻破开封，北宋灭亡（"靖康之变"）。'},{label:"南宋建立",text:"1127年，赵构（宋高宗）登上皇位，后来定都临安（今杭州），史称南宋。"},{label:"岳飞抗金",text:'岳飞统率的"岳家军"纪律严明、作战勇敢，在郾城大败金军主力。宋高宗和秦桧害怕抗金力量壮大危及统治，以"莫须有"的罪名杀害了岳飞。'},{label:"宋金和议",text:"南宋向金称臣，并给金岁币，双方以淮水至大散关一线划定分界线。宋金对峙局面形成。"}],traps:['北宋亡于金（1127靖康之变）；辽亡于金（1125）——金"灭辽又灭北宋"。','岳飞是"抗金英雄/民族英雄"（汉族与女真族是中华民族内部关系），注意表述规范。'],examTip:"政权并立形势图是地图大题常客：辽/西夏/北宋→金/西夏/南宋的演变顺序要会排。",quiz:[{q:"北宋灭亡的标志是（ ）",options:["澶渊之盟","靖康之变","郾城大捷","陈桥兵变"],answer:1,explain:'1127年金军攻破开封，掳走徽、钦二帝，北宋灭亡，史称"靖康之变"。'},{q:"宋金对峙局面形成的标志是（ ）",options:["郾城大捷","岳飞遇害","宋金和议划定分界线","南宋定都临安"],answer:2,explain:"宋金和议：南宋向金称臣、给岁币，以淮水至大散关一线为界，对峙局面形成。"}]},{id:"b11",no:11,title:"元朝的建立与统一",art:"🦅",mapId:"yuan",points:[{label:"蒙古兴起",text:'1206年，铁木真统一蒙古各部，建立蒙古政权，被尊称为"成吉思汗"。1227年蒙古灭西夏，1234年灭金。'},{label:"元朝统一",text:"忽必烈继承汗位后推行中原地区的制度与文化。1271年，忽必烈改国号为元，次年定都大都（今北京）。1276年元灭南宋，1279年攻灭南宋残部，完成了全国的统一。元朝是我国历史上第一个由少数民族贵族为主建立的全国性的统一王朝。"},{label:"行省制度",text:'元朝在中央设中书省总理全国政务；在地方设行中书省（简称"行省"），行省制度对后世影响深远，我国省级行政区的设立始于元朝。'},{label:"边疆管辖",text:"设澎湖巡检司管辖澎湖和琉球（今台湾）——这是历史上中央政府首次在台湾地区正式建立的行政机构；设宣政院直接统辖西藏——西藏正式成为中央直接管辖下的一个地方行政区域；设北庭都元帅府管理西域军政事务。"},{label:"民族交融",text:"元朝时各民族长期杂居、互相通婚，开始形成一个新的民族——回族。"}],traps:["成吉思汗（铁木真）统一蒙古，忽必烈建元统一全国——祖孙分工别混。",'元朝统一的意义关键词："第一个由少数民族贵族为主建立的全国性统一王朝"。'],examTip:'行省制度+边疆管辖（台湾/西藏/新疆）是材料题重中之重，常考"制度创新对统一多民族国家的意义"。',quiz:[{q:"我国省级行政区的设立始于（ ）",options:["秦朝","唐朝","元朝","明朝"],answer:2,explain:"元朝在地方设行中书省（行省），我国省级行政区的设立始于元朝。"},{q:"元朝为管辖澎湖和琉球（今台湾）而设置的机构是（ ）",options:["宣政院","澎湖巡检司","北庭都元帅府","中书省"],answer:1,explain:"元朝设澎湖巡检司，是中央王朝首次在台湾地区正式建立的行政机构。"},{q:"元朝时期开始形成的新民族是（ ）",options:["回族","维吾尔族","满族","藏族"],answer:0,explain:"元朝时，迁入中国的波斯人、阿拉伯人与汉、蒙、畏兀儿等长期杂居通婚，形成回族。"}]},{id:"b12",no:12,title:"宋元时期经济的繁荣",art:"🌾",points:[{label:"农业发展",text:'由越南传入的占城稻在北宋时推广到东南地区，水稻产量跃居粮食作物首位；长江下游和太湖流域一带成为丰饶的粮仓，流传"苏湖熟，天下足"的谚语。棉花种植区向北推进，元朝时棉布逐渐成为人们的主要衣料（黄道婆推广先进的棉纺织技术）。'},{label:"手工业兴盛",text:"北宋兴起的江西景德镇，后来发展成为著名的瓷都；南宋时江南地区已成为我国制瓷业中心。造船业居世界领先地位，海船配备了指南针。"},{label:"商业贸易繁荣",text:'商业城市兴起，经商时间不再受限制，出现早市和夜市；乡镇形成草市。北宋前期，四川地区出现"交子"，这是世界上最早的纸币。海外贸易超过前代，广州、泉州是闻名世界的大商港，朝廷设市舶司加以管理。'},{label:"经济重心南移",text:"从唐朝中期开始的经济重心南移，到南宋时最后完成。那时中央的财政收入主要来自南方，特别是东南地区。"}],traps:['"交子"出现于北宋前期的四川地区，是"世界上最早的纸币"。','经济重心南移：唐朝中期"开始"，南宋时"完成"——别提前也别推后。'],examTip:'"苏湖熟，天下足"、交子、市舶司是高频词；给《清明上河图》考北宋商业繁荣是经典题型。',quiz:[{q:'世界上最早的纸币"交子"出现于（ ）',options:["唐朝长安","北宋四川","南宋临安","元朝大都"],answer:1,explain:'北宋前期，四川地区出现"交子"，是世界上最早的纸币。'},{q:"经济重心南移最后完成于（ ）",options:["唐朝中期","北宋","南宋","元朝"],answer:2,explain:"从唐朝中期开始的经济重心南移，到南宋时最后完成。"}]},{id:"b13",no:13,title:"宋元时期的对外交流",art:"🧭",points:[{label:"海上丝绸之路的兴盛",text:"宋元时期造船和航海技术有了较大发展，海船配备指南针，海上交通发达，海外贸易繁荣。元朝时，海上丝绸之路进入鼎盛时期。"},{label:"海外贸易管理",text:"朝廷鼓励海外贸易，在主要港口设立市舶司加以管理。广州、泉州、明州都是闻名世界的大商港。"},{label:"中外交往",text:"意大利旅行家马可·波罗在元世祖时来华，居住了十几年。回国后口述成《马可·波罗行纪》，描述了大都的繁华景象，激起了欧洲人对东方世界的极大向往。"}],traps:['海上丝绸之路"鼎盛"在元朝，"形成"在汉武帝时——程度递进。',"马可·波罗是意大利人，来华在元朝（元世祖忽必烈时）。"],examTip:"宋元海外贸易繁荣的原因（指南针+造船技术+政府鼓励）是简答题常见设问。",quiz:[{q:"海上丝绸之路进入鼎盛时期是在（ ）",options:["汉朝","唐朝","宋朝","元朝"],answer:3,explain:"元朝时，海上交通范围有更大的拓展，海上丝绸之路进入鼎盛时期。"},{q:"宋元时期管理海外贸易的机构是（ ）",options:["市舶司","转运使","宣政院","十三行"],answer:0,explain:"朝廷在主要港口设立市舶司管理海外贸易；十三行是清朝的机构。"}]},{id:"b14",no:14,title:"辽宋夏金元时期的科技与文化",art:"📚",points:[{label:"活字印刷术",text:"北宋毕昇发明活字印刷术，对人类文明的发展产生了重大的影响。活字印刷术比欧洲的活字印刷早约四百年。"},{label:"指南针",text:'战国时人们制成指南工具"司南"；宋代制成罗盘。北宋末年，中国的海船上开始使用指南针。阿拉伯商人将指南针传到阿拉伯国家，后来又传到欧洲，大大促进了世界远洋航海技术的发展。'},{label:"火药",text:"唐朝时中国人已经发明了火药；唐朝末年火药开始运用到军事领域；宋元时期火药武器广泛用于战争。火药和火器传入欧洲后，对欧洲的火器制造和作战方式产生巨大影响，推动了欧洲社会的变革。"},{label:"天文历法",text:"北宋科学家沈括著有《梦溪笔谈》；元朝郭守敬编成《授时历》，还主持开凿通惠河。"},{label:"宋词元曲",text:'宋词代表人物：苏轼（北宋，豪放派）、李清照（两宋之交，婉约派）、辛弃疾（南宋，豪放派）。元曲包括散曲、杂剧等，关汉卿代表作《窦娥冤》，他与马致远、郑光祖、白朴并称"元曲四大家"。'},{label:"史学与绘画",text:'北宋司马光主编《资治通鉴》，是一部编年体通史巨著，记述了从战国到五代共1300多年的历史；他与司马迁并称为"史学两司马"。北宋张择端的《清明上河图》描绘了东京汴河沿岸的繁华景象。'}],traps:['活字印刷术是"毕昇"发明，雕版印刷是隋唐已有——别写成"毕昇发明印刷术"。',"《资治通鉴》是编年体（按时间），《史记》是纪传体（按人物）。"],examTip:"四大发明在宋元的发展是必考点：活字印刷（毕昇）、指南针用于航海、火药广泛用于军事。",quiz:[{q:"北宋时期发明活字印刷术的是（ ）",options:["蔡伦","毕昇","沈括","郭守敬"],answer:1,explain:"北宋毕昇发明活字印刷术，比欧洲早约四百年。"},{q:'下列科技成就传到欧洲后，"为欧洲航海家开辟新航路提供了技术条件"的是（ ）',options:["造纸术","活字印刷术","指南针","火药"],answer:2,explain:"指南针传到欧洲，大大促进了世界远洋航海技术的发展，为新航路开辟提供了条件。"},{q:"《资治通鉴》的体例是（ ）",options:["纪传体通史","编年体通史","纪事本末体","断代史"],answer:1,explain:"司马光主编的《资治通鉴》是编年体通史，记述战国到五代的历史。"}]}]},{id:"b-u3",title:"第三单元 明清时期（至鸦片战争前）",theme:"统一多民族封建国家的巩固与发展",color:"green",lessons:[{id:"b15",no:15,title:"明朝的统治",art:"🏰",points:[{label:"明朝建立",text:"1368年，朱元璋称帝，建立明朝，定都应天府（今南京），他就是明太祖。随后明军攻占元大都，结束了元朝对全国的统治。"},{label:"强化皇权",text:'在中央：废除丞相制度和中书省，六部直接向皇帝负责；设五军都督府分散兵权。在地方：取消行中书省，设立"三司"；分封诸子为王。明太祖设立锦衣卫，明成祖又成立东厂，厂卫成为皇帝的耳目和爪牙。'},{label:"八股取士",text:'明朝提倡尊孔崇儒，规定考试题目必须来自"四书""五经"，考生对题目的解释必须以朱熹的《四书集注》等为标准，答卷文体必须分成八个部分，称为"八股文"。八股取士禁锢思想，应试的人为了能够被录取，死读"四书""五经"，成为皇帝旨意的顺从者。'},{label:"迁都北京",text:"明成祖时把都城从南京迁到北京（1421年），有利于加强对北方的控制。"}],traps:['废除丞相制度的是"明太祖朱元璋"，从此六部直接对皇帝负责。',"锦衣卫设于明太祖时，东厂设于明成祖时。"],examTip:'"废丞相、设三司、厂卫、八股"四件套是明朝皇权强化的标配考点，常与清朝军机处串联对比。',quiz:[{q:"废除丞相制度、权分六部的皇帝是（ ）",options:["汉武帝","唐太宗","宋太祖","明太祖"],answer:3,explain:"明太祖朱元璋废除丞相制度和中书省，六部直接向皇帝负责，皇权大大加强。"},{q:"明朝科举考试对答题观点的标准依据是（ ）",options:["考生个人见解","朱熹《四书集注》","《资治通鉴》","《道德经》"],answer:1,explain:"明朝八股取士规定，对题目的解释必须以朱熹的《四书集注》等为标准。"}]},{id:"b16",no:16,title:"明朝的对外关系",art:"⛴️",mapId:"zhenghe",points:[{label:"郑和下西洋",text:'1405—1433年，郑和率船队七次下西洋，先后到达亚洲和非洲的30多个国家和地区，最远到达非洲东海岸和红海沿岸。目的：提高明朝在国外的地位和威望、"示中国富强"。评价：时间之长、规模之大、范围之广，堪称世界航海史上的空前壮举；增进了中国与亚非国家和地区的相互了解和友好往来，开创了西太平洋与印度洋之间的亚非海上交通线。'},{label:"戚继光抗倭",text:'明朝中期，倭寇猖獗。戚继光训练"戚家军"，在台州九战九捷，平定了浙东地区的倭患；随后进入福建、广东，使东南沿海的倭患基本解除。"封侯非我意，但愿海波平"——戚继光是我国历史上一位伟大的民族英雄。'},{label:"澳门问题",text:"1553年，葡萄牙殖民者攫取了在我国广东澳门的居住权。"}],traps:['郑和下西洋"最远到达非洲东海岸和红海沿岸"，没有到过欧洲。','戚继光抗倭抗击的是外国侵略者，所以称"民族英雄"；岳飞抗金是中华民族内部冲突。'],examTip:"郑和下西洋的意义是简答题常客；注意与新航路开辟对比（时间更早、规模更大、目的不同）。",quiz:[{q:"郑和下西洋最远到达（ ）",options:["地中海沿岸","非洲东海岸和红海沿岸","欧洲西海岸","美洲大陆"],answer:1,explain:"郑和船队最远到达非洲东海岸和红海沿岸，是世界航海史上的空前壮举。"},{q:'"封侯非我意，但愿海波平"出自哪位民族英雄（ ）',options:["岳飞","文天祥","戚继光","郑成功"],answer:2,explain:"这是戚继光的诗句，表达了他平定倭患、保卫海疆的志向。"}]},{id:"b17",no:17,title:"明朝的灭亡和清朝的建立",art:"🍂",points:[{label:"明朝灭亡",text:'明朝末年政治腐败、财政危机深重，朝廷不断加派赋税，陕北连年灾荒，爆发农民大起义。李自成提出"均田免赋"口号，1644年建立大顺政权，随后攻占北京，崇祯帝自缢，明朝灭亡。'},{label:"满洲兴起",text:"1616年，努尔哈赤统一女真各部，建立后金。1635年皇太极改女真族名为满洲，1636年改国号为清。"},{label:"清兵入关",text:"1644年，驻守山海关的明军将领吴三桂降清，引清军入关，并与清军联合夹击李自成的军队，李自成最后失败。"}],traps:['改国号为"清"的是皇太极，努尔哈赤建立的是"后金"。','李自成起义的口号是"均田免赋"，陈胜吴广是"王侯将相宁有种乎"。'],examTip:'"明清易代"时间线：1616后金→1636清→1644入关。常与"明亡原因"（腐败+灾荒+起义）一起考。',quiz:[{q:"1644年攻占北京、推翻明朝的起义领袖是（ ）",options:["黄巢","张献忠","李自成","陈胜"],answer:2,explain:"1644年李自成率军攻占北京，崇祯帝自缢，明朝灭亡。"},{q:"改国号为清的统治者是（ ）",options:["努尔哈赤","皇太极","顺治帝","康熙帝"],answer:1,explain:"1635年皇太极改族名为满洲，1636年改国号为清。"}]},{id:"b18",no:18,title:"清朝的边疆治理",art:"🗺️",mapId:"qing",points:[{label:"郑成功收复台湾",text:"1661—1662年，郑成功率军从荷兰殖民者手中收复台湾，台湾重新回到祖国的怀抱。郑成功是我国历史上的民族英雄。"},{label:"清朝在台湾建制",text:"1683年清军进入台湾；1684年，清朝设置台湾府，隶属福建省。台湾府的设置，加强了中央政府对台湾的管辖，巩固了祖国的东南海防。1885年，台湾正式建省。"},{label:"清廷对西藏的管辖",text:'顺治帝册封五世达赖"达赖喇嘛"封号；康熙帝册封五世班禅"班禅额尔德尼"封号；1727年（雍正时）设置驻藏大臣，监督西藏地方政务；1793年颁布《钦定藏内善后章程》，规范金瓶掣签等制度。'},{label:"巩固西北边疆",text:"康熙帝三次亲征，平定噶尔丹叛乱；乾隆帝平定大小和卓叛乱；设置伊犁将军，管辖包括巴勒喀什池在内的整个新疆地区。1771年，渥巴锡率领土尔扈特部回归祖国，受到乾隆帝妥善安置。"},{label:"雅克萨之战与《尼布楚条约》",text:"1685年和1686年，康熙帝两次命令清军进攻盘踞雅克萨的俄军。1689年，中俄签订第一个边界条约《尼布楚条约》，从法律上肯定了黑龙江和乌苏里江流域包括库页岛在内的广大地区都是中国领土。"},{label:"清朝疆域",text:"清朝前期，中国西跨葱岭，西北至巴勒喀什池，北接西伯利亚，西南达喜马拉雅山脉，东北至黑龙江以北的外兴安岭和库页岛，东临太平洋，东南到台湾及其附属岛屿（包括钓鱼岛、赤尾屿等），南至南海诸岛，成为亚洲最大的国家。"}],traps:["收复台湾的是郑成功（从荷兰人手中），设置台湾府的是清朝（1684年）——两件事别并成一件。","驻藏大臣设于1727年（雍正），不是顺治康熙；伊犁将军管新疆。"],examTip:'本课是"统一多民族国家巩固"的核心，材料题爱考"台湾/西藏/新疆治理措施+意义"，按地区整理表格记忆。',quiz:[{q:"1662年从荷兰殖民者手中收复台湾的民族英雄是（ ）",options:["戚继光","郑成功","康熙帝","林则徐"],answer:1,explain:"郑成功1662年收复台湾，台湾回到祖国怀抱。"},{q:`清朝为加强对西藏的管辖而采取的措施有（ ）
①册封达赖、班禅 ②设置驻藏大臣 ③设置伊犁将军 ④颁布《钦定藏内善后章程》`,options:["①②③","①②④","①③④","②③④"],answer:1,explain:"伊犁将军管辖的是新疆地区，与西藏无关；①②④都是对藏措施。"},{q:"中俄第一个边界条约是（ ）",options:["《南京条约》","《尼布楚条约》","《北京条约》","《瑷珲条约》"],answer:1,explain:"1689年签订的《尼布楚条约》是中俄第一个边界条约，是平等条约。"}]},{id:"b19",no:19,title:"清朝君主专制的强化",art:"🔒",points:[{label:"军机处的设立",text:"雍正年间，朝廷设立军机处，由皇帝选派亲信大臣组成。军机处是辅助皇帝处理政务的最重要的中枢机构，军政大事完全由皇帝裁决，军机大臣照皇帝旨意拟写成文、传达执行。军机处的设立，标志着君主专制进一步强化（达到顶峰）。"},{label:"文字狱与文化专制",text:'康熙、雍正和乾隆三朝，经常从知识分子的文章、诗词中摘取只言片语，加以歪曲解释，罗织罪名，制造了大批冤狱，人们把这种做法称为"文字狱"。文字狱禁锢了人们的思想言论，严重阻碍了思想、学术的发展和进步。'},{label:"闭关锁国政策",text:'清朝实行严格限制对外贸易的"闭关锁国"政策。1757年，只开放广州一处作为对外通商口岸，由朝廷特许的"广州十三行"统一经营对外贸易。评价：对西方殖民者的侵略活动曾起到过一定的自卫作用；但是清廷故步自封、闭关自守，使中国错失了向西方学习先进的科学知识和生产技术的机会，中国逐渐落伍于世界历史的发展进程。'}],traps:['军机处设于雍正，不是康熙乾隆；它标志着君主专制"达到顶峰"。','闭关锁国是"严格限制"而非"完全禁止"对外贸易，广州十三行仍保留一口通商。'],examTip:"闭关锁国的评价必须辩证作答（自卫作用+落伍代价），是材料题的经典设问。",quiz:[{q:"标志着我国君主专制达到顶峰的机构是（ ）",options:["锦衣卫","东厂","军机处","中书省"],answer:2,explain:"雍正时设立军机处，军政大事完全由皇帝裁决，君主专制进一步强化并达到顶峰。"},{q:"清朝前期实行闭关锁国政策，只开放的通商口岸是（ ）",options:["上海","广州","宁波","厦门"],answer:1,explain:'1757年清廷下令只开放广州一处对外通商，由"广州十三行"统一经营。'}]},{id:"b20",no:20,title:"明清时期社会经济的发展",art:"🌽",points:[{label:"农业的发展",text:"明代引进了原产于美洲的玉米、甘薯、马铃薯、花生和向日葵等高产作物，清朝前期得到大面积推广，提高了粮食产量。"},{label:"手工业的进步",text:"棉纺织业、丝织业、制瓷业等发展；出现了比较成熟的手工业工场，如机户出资、机工出力——这表明明朝中期以后，江南地区出现了资本主义萌芽。"},{label:"商业的繁荣",text:"明清时期商品经济相当活跃，北京和南京是全国性的商贸城市；形成了一些大的商帮，如山西的晋商、安徽的徽商。"},{label:"人口的增长",text:"清朝前期人口数量有了很大的增长：康熙时全国人口总数已达1.5亿，乾隆末年发展到3亿，占当时世界总人口的三分之一。人口快速增长也带来了人地矛盾、生态破坏等问题。"}],traps:["玉米、甘薯、马铃薯原产美洲，明朝才传入中国——所以秦汉人吃不到玉米。",'"机户出资，机工出力"是雇佣关系，是资本主义萌芽的标志，出现在江南手工业。'],examTip:'"美洲作物传入"常与世界史新航路开辟联动考查；人口增长的影响（积极+消极）要会两面分析。',quiz:[{q:"下列农作物中，明朝时从美洲传入中国的是（ ）",options:["水稻","粟","玉米","小麦"],answer:2,explain:"明代引进原产美洲的玉米、甘薯、马铃薯、花生、向日葵等。"},{q:'"机户出资，机工出力"反映的历史现象是（ ）',options:["自然经济解体","资本主义萌芽的出现","重农抑商政策","海外贸易繁荣"],answer:1,explain:"机户与机工之间是雇佣与被雇佣的关系，标志着明朝中后期江南地区出现资本主义萌芽。"}]},{id:"b21",no:21,title:"明清时期的科技与文化",art:"📖",points:[{label:"科技名著",text:'李时珍（明）所著《本草纲目》总结了我国古代药物学成就，在世界医药史上占有重要地位；徐光启《农政全书》是一部农业科学巨著；宋应星《天工开物》被誉为"中国17世纪的工艺百科全书"。'},{label:"宏伟建筑",text:"明长城东起鸭绿江边、西至嘉峪关，是明朝修筑长城规模最大、历时最久的防御工程；北京城由明成祖时营建，紫禁城（今故宫）是当时世界上最宏大、最辉煌的皇家建筑群。"},{label:"古典小说",text:"罗贯中《三国志通俗演义》是我国最为流行的长篇历史小说之一，是章回体小说的开山之作；施耐庵《水浒传》、吴承恩《西游记》都是优秀长篇小说；曹雪芹《红楼梦》是我国古代最优秀的长篇小说，艺术成就最高、影响最深远，在世界文学史上占有重要地位。"},{label:"戏剧艺术",text:'明朝汤显祖《牡丹亭》；清朝昆曲艺术发展到顶峰；道光年间，徽调不断吸收昆曲、秦腔等剧种的优点，逐渐形成新的剧种"皮黄戏"——即后来的京剧。'}],traps:['明长城"东起鸭绿江、西至嘉峪关"；秦长城"西起临洮、东到辽东"——起止点不同。',"四大名著中《红楼梦》地位最高；罗贯中的作品原名《三国志通俗演义》。"],examTip:'"人物+著作+誉称"铁三角：李时珍《本草纲目》、宋应星《天工开物》（17世纪工艺百科全书）年年见。',quiz:[{q:'被誉为"中国17世纪的工艺百科全书"的是（ ）',options:["《本草纲目》","《农政全书》","《天工开物》","《齐民要术》"],answer:2,explain:'宋应星的《天工开物》被誉为"中国17世纪的工艺百科全书"。'},{q:"我国古代艺术成就最高、影响最深远的长篇小说是（ ）",options:["《三国演义》","《水浒传》","《西游记》","《红楼梦》"],answer:3,explain:"曹雪芹的《红楼梦》是我国古代最优秀的长篇小说，艺术成就最高、影响最深远。"}]}]}]},Gc=[{id:"first",name:"初窥史海",desc:"完成第1课小测",icon:"🌱",color:"#84A59D",check:(u,r)=>r.lessonsDone>=1},{id:"five-lessons",name:"学而不倦",desc:"完成5课小测",icon:"📚",color:"#F28482",check:(u,r)=>r.lessonsDone>=5},{id:"right-20",name:"百步穿杨",desc:"累计答对20题",icon:"🎯",color:"#C79A4B",check:(u,r)=>r.totalRight>=20},{id:"streak-3",name:"锲而不舍",desc:"连续打卡3天",icon:"🔥",color:"#E76F51",check:u=>u.streak>=3},{id:"streak-7",name:"手不释卷",desc:"连续打卡7天",icon:"📖",color:"#B23A2E",check:u=>u.streak>=7},{id:"maps-5",name:"胸怀天下",desc:"探索5张历史地图",icon:"🗺️",color:"#5E7D8B",check:u=>Object.keys(u.mapsSeen).length>=5},{id:"points-300",name:"学富五车",desc:"积分达到300",icon:"🏆",color:"#C79A4B",check:u=>u.points>=300},{id:"book-a",name:"通古博今·上",desc:"完成七年级上册全部小测",icon:"🏺",color:"#8C7B5E",check:u=>u.lessonsDone.__7a__===!0},{id:"book-b",name:"通古博今·下",desc:"完成七年级下册全部小测",icon:"🏮",color:"#A63D40",check:u=>u.lessonsDone.__7b__===!0}],Un=[Wm,Fm],Cn=Un.flatMap(u=>u.units.flatMap(r=>r.lessons.flatMap(m=>m.quiz.map((c,d)=>({...c,id:`${m.id}-${d}`,lessonId:m.id,lessonTitle:m.title,bookId:u.id})))));function v0(u){return Cn.find(r=>r.id===u)}function Im(){const u=Math.floor(Date.now()/864e5);return Cn[u%Cn.length]}function g0(u,r=[]){const c=[...Cn.filt
